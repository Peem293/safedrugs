version: '3.8'

services:
  app:
    build: .
    container_name: safedrugs-app
    # KUNCI UTAMA: Hapus atau matikan bagian volumes jika ada di sini!
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=safedrugs_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    networks:
      - safedrugs-network

  web:
    image: nginx:alpine
    container_name: safedrugs-web
    ports:
      - "8081:80"
    # Di sisi web server, kita hanya menembak volume dari container app (volumes_from)
    volumes_from:
      - app
    command: /bin/sh -c "echo 'server { listen 80; root /var/www/html/public; index index.php; location / { try_files \$$uri \$$uri/ /index.php?\$$query_string; } location ~ \.php$ { fastcgi_pass app:9000; fastcgi_index index.php; include fastcgi_params; fastcgi_param SCRIPT_FILENAME \$$document_root\$$fastcgi_script_name; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - safedrugs-network

  db:
    image: postgres:16-alpine
    container_name: safedrugs-db
    environment:
      POSTGRES_DB: safedrugs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - safedrugs-db-data:/var/lib/postgresql/data
    networks:
      - safedrugs-network

networks:
  safedrugs-network:
    driver: bridge

volumes:
  safedrugs-db-data:
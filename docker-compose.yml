services:
  app:
    build: .
    container_name: safedrugs-app
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=safedrugs_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - APP_KEY=base64:c29tZXJhbmRvbWtleXRoYXR5b3VzaG91bGRjaGFuZ2U=
    networks:
      - safedrugs-network

  web:
    image: nginx:alpine
    container_name: safedrugs-web
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    # Konfigurasi Nginx langsung dibuat di dalam container saat start
    command: /bin/sh -c "echo 'server { listen 80; root /var/www/html/public; index index.php; location / { try_files \$$uri \$$uri/ /index.php?\$$query_string; } location ~ \.php$ { fastcgi_pass app:9000; fastcgi_index index.php; include fastcgi_params; fastcgi_param SCRIPT_FILENAME \$$document_root\$$fastcgi_script_name; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - app
    networks:
      - safedrugs-network

  db:
    image: postgres:16-alpine
    container_name: safedrugs-db
    environment:
      POSTGRES_DB: safedrugs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - safedrugs-network

networks:
  safedrugs-network:
    driver: bridge

volumes:
  postgres_data: